name: Sync Tracker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node sync.js --token $GITHUB_TOKEN

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet tracker.json && echo "No changes" && exit 0
          git add tracker.json
          git commit -m "Auto-sync tracker $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
