<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usage Example Tracker — SplashKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1117;--surface:#161822;--surface-2:#1c1e2c;--surface-3:#222436;--border:#2a2d40;--border-hover:#3a3d55;--text:#e4e4ec;--text-muted:#6e7086;--sk-orange:#e8a020;--sk-orange-dim:rgba(232,160,32,0.1);--sk-orange-border:rgba(232,160,32,0.25);--sk-teal:#3cc8c8;--sk-teal-dim:rgba(60,200,200,0.08);--sk-teal-border:rgba(60,200,200,0.2);--green:#2dd4a0;--green-bg:#0b2e24;--green-border:#15503a;--yellow:#e8a020;--yellow-bg:#2e2008;--yellow-border:#503a15;--blue:#4d8ef7;--blue-bg:#0c1a30;--blue-border:#153a66;--purple:#a66df7;--purple-bg:#1a0c30;--purple-border:#3a1566;--gray:#5a5a6e;--gray-bg:#161618;--gray-border:#2a2a30;--red:#ef4444;--font:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;--radius:10px;--radius-sm:6px}
  *{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}a{color:var(--sk-teal);text-decoration:none}a:hover{text-decoration:underline}
  .header{border-bottom:1px solid var(--border);background:var(--surface);position:relative;overflow:hidden}.header::before{content:'';position:absolute;top:-40px;right:-40px;width:260px;height:260px;background:radial-gradient(circle,rgba(232,160,32,0.06) 0%,transparent 70%);pointer-events:none}.header::after{content:'';position:absolute;top:-20px;right:80px;width:180px;height:180px;background:radial-gradient(circle,rgba(60,200,200,0.04) 0%,transparent 70%);pointer-events:none}
  .header-inner{max-width:980px;margin:0 auto;padding:20px 24px 18px;position:relative}.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.header-brand{display:flex;align-items:center;gap:14px}.sk-logo{width:40px;height:40px;flex-shrink:0}.brand-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--sk-teal);margin-bottom:2px}
  .header h1{font-size:20px;font-weight:800;letter-spacing:-0.03em;color:var(--text);line-height:1.2}.header h1 span{color:var(--sk-orange)}.header-tagline{font-size:11px;color:var(--text-muted);margin-top:3px}
  .lead-toggle{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-muted);cursor:pointer;user-select:none;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);transition:border-color 0.15s;margin-top:2px}.lead-toggle:hover{border-color:var(--sk-teal-border)}.lead-toggle input{accent-color:var(--sk-teal)}
  .main{max-width:980px;margin:0 auto;padding:0 24px 60px}.stats-bar{display:flex;gap:6px;padding:16px 0 14px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:14px}
  .stat-btn{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:11px;font-weight:600;font-family:var(--font);transition:all 0.15s;letter-spacing:0.01em}.stat-btn:hover{border-color:var(--border-hover)}.stat-btn.dimmed{opacity:0.3}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.search-input,.cat-select{padding:9px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border-color 0.15s}.search-input:focus{border-color:var(--sk-teal);box-shadow:0 0 0 2px var(--sk-teal-dim)}.cat-select:focus{border-color:var(--sk-teal)}.search-input{flex:1;min-width:200px}.search-input::placeholder{color:var(--text-muted)}.cat-select{min-width:140px;cursor:pointer}
  .btn{padding:8px 16px;border-radius:var(--radius-sm);border:none;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;color:#fff;transition:opacity 0.15s}.btn:hover{opacity:0.85}.btn-accent{background:var(--sk-teal);color:#0f1117}.btn-dim{background:var(--surface-3);border:1px solid var(--border);color:var(--text-muted)}
  .lead-tools{display:none;gap:8px;margin-bottom:14px;flex-wrap:wrap}.lead-tools.visible{display:flex}
  .cat-group{margin-bottom:20px}.cat-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:9px 16px;display:flex;justify-content:space-between;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--sk-teal-border);border-bottom:none}.cat-header .avail{color:var(--green);font-weight:700}
  .cat-entries{background:var(--surface);border:1px solid var(--sk-teal-border);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
  .entry{display:flex;justify-content:space-between;align-items:start;padding:11px 16px;border-bottom:1px solid #181a28;gap:10px;transition:background 0.1s}.entry:hover{background:var(--surface-2)}.entry:last-child{border-bottom:none}.entry-main{flex:1;min-width:0}.entry-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .func-name{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}.entry-desc{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.45}.entry-meta{font-size:11px;color:#484860;margin-top:3px}.entry-meta a{color:var(--sk-teal);font-size:11px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap}.badge-available{color:var(--green);background:var(--green-bg);border:1px solid var(--green-border)}.badge-claimed{color:var(--yellow);background:var(--yellow-bg);border:1px solid var(--yellow-border)}.badge-in_progress{color:var(--blue);background:var(--blue-bg);border:1px solid var(--blue-border)}.badge-in_review{color:var(--purple);background:var(--purple-bg);border:1px solid var(--purple-border)}.badge-merged{color:var(--gray);background:var(--gray-bg);border:1px solid var(--gray-border)}
  .cat-tag{font-size:10px;color:#404055}.edit-btns{display:flex;gap:4px;flex-shrink:0}.icon-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-size:13px;padding:3px 8px;font-family:var(--font);transition:all 0.15s}.icon-btn:hover{border-color:var(--sk-teal);color:var(--text)}.icon-btn.del:hover{border-color:var(--red);color:var(--red)}
  .empty{text-align:center;padding:52px 20px;color:var(--text-muted)}.footer{text-align:center;padding:24px 0;font-size:11px;color:#333345;border-top:1px solid var(--border);margin-top:8px}.footer a{color:var(--sk-orange);font-weight:600}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}.modal{background:var(--surface);border:1px solid var(--sk-teal-border);border-radius:14px;padding:28px;width:100%;max-width:520px;box-shadow:0 24px 64px rgba(0,0,0,0.5)}.modal h2{font-size:16px;margin-bottom:18px;font-weight:700}.modal label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px}.modal input,.modal select,.modal textarea{padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:var(--font);outline:none;width:100%;transition:border-color 0.15s}.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--sk-teal)}.modal textarea{resize:vertical}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
  @media(max-width:600px){.header-top{flex-direction:column}.controls{flex-direction:column}.search-input,.cat-select{width:100%}.entry{flex-direction:column}.edit-btns{align-self:flex-end}.header h1{font-size:18px}.sk-logo{width:34px;height:34px}}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><div class="header-top">
  <div class="header-brand">
    <svg class="sk-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="translate(5,5)"><path d="M10 30 L45 10 L80 30 L80 70 L45 90 L10 70 Z" fill="#e8a020" stroke="#3a3530" stroke-width="4" stroke-linejoin="round"/><path d="M10 30 L45 10 L80 30 L45 50 Z" fill="#f0b030" stroke="#3a3530" stroke-width="4" stroke-linejoin="round"/><path d="M10 30 L45 50 L45 90 L10 70 Z" fill="#d09018" stroke="#3a3530" stroke-width="4" stroke-linejoin="round"/><path d="M80 30 L45 50 L45 90 L80 70 Z" fill="#e8a020" stroke="#3a3530" stroke-width="4" stroke-linejoin="round"/><path d="M30 12 L30 45 L38 38 L46 45 L46 12" fill="#3cc8c8" stroke="#3a3530" stroke-width="3" stroke-linejoin="round"/><line x1="55" y1="68" x2="68" y2="62" stroke="#3a3530" stroke-width="3" stroke-linecap="round"/><line x1="55" y1="75" x2="65" y2="70" stroke="#3a3530" stroke-width="3" stroke-linecap="round"/></g></svg>
    <div><div class="brand-label">SplashKit Website</div><h1>Usage Example <span>Tracker</span></h1><div class="header-tagline">Browse. Select. Claim. Obey the board.</div></div>
  </div>
  <label class="lead-toggle"><input type="checkbox" id="leadToggle"> Lead mode</label>
</div></div></div>
<div class="main">
  <div class="stats-bar" id="statsBar"></div>
  <div class="controls"><input class="search-input" id="searchInput" placeholder="Search function, description, contributor..." autocomplete="off"><select class="cat-select" id="catSelect"></select><button class="btn btn-accent" id="addBtn" style="display:none" onclick="openAdd()">+ Add</button></div>
  <div class="lead-tools" id="leadTools"><button class="btn btn-dim" onclick="exportJSON()">Export JSON</button><button class="btn btn-dim" onclick="importJSON()">Import JSON</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)"></div>
  <div id="content"></div>
</div>
<div class="modal-overlay" id="editModal" style="display:none"><div class="modal"><h2 id="modalTitle">Edit Entry</h2><label>Function Name<input id="mFuncName" placeholder="e.g. fill_rectangle"></label><label>Category<select id="mCategory"></select></label><label>Description<textarea id="mDesc" rows="2" placeholder="What does this example cover?"></textarea></label><label>Status<select id="mStatus"><option value="available">Available</option><option value="claimed">Claimed</option><option value="in_progress">In Progress</option><option value="in_review">In Review</option><option value="merged">Merged</option></select></label><label>Claimed By<input id="mClaimedBy" placeholder="GitHub username"></label><label>PR Link (optional)<input id="mPrLink" placeholder="https://github.com/..."></label><div class="modal-actions"><button class="btn btn-dim" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="saveModal()">Save</button></div></div></div>
<script>
const DATA_URL='tracker.json',STATUS_LABELS={available:'Available',claimed:'Claimed',in_progress:'In Progress',in_review:'In Review',merged:'Merged'},STATUS_COLORS={available:{c:'var(--green)',bg:'var(--green-bg)',b:'var(--green-border)'},claimed:{c:'var(--yellow)',bg:'var(--yellow-bg)',b:'var(--yellow-border)'},in_progress:{c:'var(--blue)',bg:'var(--blue-bg)',b:'var(--blue-border)'},in_review:{c:'var(--purple)',bg:'var(--purple-bg)',b:'var(--purple-border)'},merged:{c:'var(--gray)',bg:'var(--gray-bg)',b:'var(--gray-border)'}},CATEGORIES=["Animations","Audio","Camera","Color","Generative AI","Geometry","Graphics","Input","Interface","JSON","Logging","Networking","Physics","Raspberry","Resource Bundles","Resources","Sprites","Terminal","Timers","Types","Utilities","Windows","Other"];
let data={entries:[]},filterStatus='all',filterCategory='all',searchQuery='',isLead=false,editingId=null;
const searchInput=document.getElementById('searchInput'),catSelect=document.getElementById('catSelect'),statsBar=document.getElementById('statsBar'),content=document.getElementById('content'),addBtn=document.getElementById('addBtn'),leadTools=document.getElementById('leadTools');
catSelect.innerHTML='<option value="all">All categories</option>'+CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');
const mCatSel=document.getElementById('mCategory');CATEGORIES.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;mCatSel.appendChild(o)});
let searchTimeout;searchInput.addEventListener('input',()=>{clearTimeout(searchTimeout);searchTimeout=setTimeout(()=>{searchQuery=searchInput.value;renderContent()},120)});
catSelect.addEventListener('change',()=>{filterCategory=catSelect.value;renderContent()});
document.getElementById('leadToggle').addEventListener('change',e=>{isLead=e.target.checked;addBtn.style.display=isLead?'':'none';leadTools.classList.toggle('visible',isLead);renderContent()});
async function loadData(){try{const r=await fetch(DATA_URL+'?t='+Date.now());if(!r.ok)throw new Error();data=await r.json()}catch(e){const s=localStorage.getItem('splashkit-tracker');if(s)data=JSON.parse(s);else data={entries:[]}}renderStats();renderContent()}
function saveLocal(){localStorage.setItem('splashkit-tracker',JSON.stringify(data))}function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function renderStats(){const entries=data.entries||[],stats={};Object.keys(STATUS_LABELS).forEach(s=>stats[s]=entries.filter(e=>e.status===s).length);let h='';Object.entries(STATUS_LABELS).forEach(([k,l])=>{const sc=STATUS_COLORS[k],a=filterStatus===k,cl=filterStatus==='all'?'':(a?'active':'dimmed');h+=`<button class="stat-btn ${cl}" style="color:${sc.c};border-color:${a?sc.b:'var(--border)'};background:${a?sc.bg:'transparent'}" onclick="toggleStatus('${k}')">${l}: ${stats[k]||0}</button>`});if(filterStatus!=='all')h+=`<button class="stat-btn" style="color:var(--text-muted)" onclick="toggleStatus('all')">show all</button>`;statsBar.innerHTML=h}
function renderContent(){const entries=data.entries||[],filtered=entries.filter(e=>{if(filterStatus!=='all'&&e.status!==filterStatus)return false;if(filterCategory!=='all'&&e.category!==filterCategory)return false;if(searchQuery){const q=searchQuery.toLowerCase();return e.functionName.toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)||(e.claimedBy||'').toLowerCase().includes(q)}return true}),groups={};filtered.forEach(e=>{if(!groups[e.category])groups[e.category]=[];groups[e.category].push(e)});const cats=Object.keys(groups).sort();let h='';if(!filtered.length){h+=entries.length===0?'<div class="empty"><p style="font-size:14px;margin-bottom:8px">No data loaded.</p><p style="font-size:12px">Enable Lead mode and Import JSON.</p></div>':'<div class="empty"><p style="font-size:13px">No entries match your filters.</p></div>'}else{cats.forEach(cat=>{const ce=groups[cat],ac=ce.filter(e=>e.status==='available').length;h+='<div class="cat-group">';h+=`<div class="cat-header"><span>${esc(cat)}</span>${ac>0?`<span class="avail">${ac} available</span>`:''}`;h+='</div><div class="cat-entries">';ce.forEach(e=>{h+=`<div class="entry"><div class="entry-main"><div class="entry-top"><span class="func-name">${esc(e.functionName)}</span><span class="badge badge-${e.status}">${STATUS_LABELS[e.status]||e.status}</span><span class="cat-tag">${esc(e.category)}</span></div>`;if(e.description&&!e.description.startsWith('(add description'))h+=`<div class="entry-desc">${esc(e.description)}</div>`;if(e.claimedBy){h+=`<div class="entry-meta">&rarr; ${esc(e.claimedBy)}`;if(e.prLink)h+=` <a href="${esc(e.prLink)}" target="_blank" rel="noopener">PR &nearr;</a>`;h+='</div>'}h+='</div>';if(isLead)h+=`<div class="edit-btns"><button class="icon-btn" onclick="openEdit('${e.id}')">✎</button><button class="icon-btn del" onclick="deleteEntry('${e.id}')">✕</button></div>`;h+='</div>'});h+='</div></div>'})}const st={};Object.keys(STATUS_LABELS).forEach(s=>st[s]=entries.filter(e=>e.status===s).length);h+=`<div class="footer">${entries.length} functions &middot; ${st.available||0} available &middot; <a href="https://splashkit.io/api/" target="_blank">splashkit.io</a>`;if(data.lastUpdated)h+=` &middot; synced ${new Date(data.lastUpdated).toLocaleDateString()}`;h+='</div>';content.innerHTML=h;renderStats()}
function toggleStatus(s){filterStatus=filterStatus===s?'all':s;renderContent()}
function openEdit(id){editingId=id;const e=data.entries.find(x=>x.id===id);if(!e)return;document.getElementById('modalTitle').textContent='Edit Entry';document.getElementById('mFuncName').value=e.functionName||'';document.getElementById('mCategory').value=e.category||'Other';document.getElementById('mDesc').value=e.description||'';document.getElementById('mStatus').value=e.status||'available';document.getElementById('mClaimedBy').value=e.claimedBy||'';document.getElementById('mPrLink').value=e.prLink||'';document.getElementById('editModal').style.display='flex'}
function openAdd(){editingId=null;document.getElementById('modalTitle').textContent='Add Entry';document.getElementById('mFuncName').value='';document.getElementById('mCategory').value=filterCategory!=='all'?filterCategory:'Graphics';document.getElementById('mDesc').value='';document.getElementById('mStatus').value='available';document.getElementById('mClaimedBy').value='';document.getElementById('mPrLink').value='';document.getElementById('editModal').style.display='flex'}
function closeModal(){document.getElementById('editModal').style.display='none'}
function saveModal(){const entry={functionName:document.getElementById('mFuncName').value.trim(),category:document.getElementById('mCategory').value,description:document.getElementById('mDesc').value.trim(),status:document.getElementById('mStatus').value,claimedBy:document.getElementById('mClaimedBy').value.trim(),prLink:document.getElementById('mPrLink').value.trim()};if(!entry.functionName)return;if(editingId){const i=data.entries.findIndex(e=>e.id===editingId);if(i>=0)Object.assign(data.entries[i],entry)}else{entry.id=genId();entry.createdAt=new Date().toISOString();data.entries.push(entry)}data.lastUpdated=new Date().toISOString();saveLocal();closeModal();renderContent()}
function deleteEntry(id){if(!confirm('Remove this entry?'))return;data.entries=data.entries.filter(e=>e.id!==id);data.lastUpdated=new Date().toISOString();saveLocal();renderContent()}
function exportJSON(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tracker.json';a.click();URL.revokeObjectURL(a.href)}
function importJSON(){document.getElementById('importFile').click()}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{const d=JSON.parse(ev.target.result);if(d.entries&&Array.isArray(d.entries)){data=d;data.lastUpdated=new Date().toISOString();saveLocal();renderContent()}else alert('Invalid JSON.')}catch(err){alert('Invalid JSON file.')}};r.readAsText(f);e.target.value=''}
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
loadData();
</script>
</body>
</html>
