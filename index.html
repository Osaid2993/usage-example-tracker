<style>
  :root{--bg:#0f1117;--surface:#161822;--surface-2:#1c1e2c;--surface-3:#222436;--border:#2a2d40;--border-hover:#3a3d55;--text:#e4e4ec;--text-muted:#6e7086;--sk-orange:#e8a020;--sk-orange-dim:rgba(232,160,32,0.1);--sk-orange-border:rgba(232,160,32,0.25);--sk-teal:#3cc8c8;--sk-teal-dim:rgba(60,200,200,0.08);--sk-teal-border:rgba(60,200,200,0.2);--green:#2dd4a0;--green-bg:#0b2e24;--green-border:#15503a;--yellow:#e8a020;--yellow-bg:#2e2008;--yellow-border:#503a15;--blue:#4d8ef7;--blue-bg:#0c1a30;--blue-border:#153a66;--purple:#a66df7;--purple-bg:#1a0c30;--purple-border:#3a1566;--gray:#5a5a6e;--gray-bg:#161618;--gray-border:#2a2a30;--red:#ef4444;--font:'Inter',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;--radius:10px;--radius-sm:6px}
  *{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}a{color:var(--sk-teal);text-decoration:none}a:hover{text-decoration:underline}

  .header-inner{max-width:980px;margin:0 auto;padding:20px 24px 18px;position:relative}.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.header-brand{display:flex;align-items:center;gap:14px}.sk-logo{width:40px;height:40px;flex-shrink:0}.brand-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--sk-teal);margin-bottom:2px}
  .header h1{font-size:20px;font-weight:800;letter-spacing:-0.03em;color:var(--text);line-height:1.2}.header h1 span{color:var(--sk-orange)}.header-tagline{font-size:11px;color:var(--text-muted);margin-top:3px}

  .main{max-width:980px;margin:0 auto;padding:0 24px 60px}.stats-bar{display:flex;gap:6px;padding:16px 0 14px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:14px}
  .stat-btn{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:11px;font-weight:600;font-family:var(--font);transition:all 0.15s;letter-spacing:0.01em}.stat-btn:hover{border-color:var(--border-hover)}.stat-btn.dimmed{opacity:0.3}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.search-input,.cat-select{padding:9px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-family:var(--font);outline:none;transition:border-color 0.15s}.search-input:focus{border-color:var(--sk-teal);box-shadow:0 0 0 2px var(--sk-teal-dim)}.cat-select:focus{border-color:var(--sk-teal)}.search-input{flex:1;min-width:200px}.search-input::placeholder{color:var(--text-muted)}.cat-select{min-width:140px;cursor:pointer}
  .btn{padding:8px 16px;border-radius:var(--radius-sm);border:none;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;color:#fff;transition:opacity 0.15s}.btn:hover{opacity:0.85}.btn-accent{background:var(--sk-teal);color:#0f1117}.btn-dim{background:var(--surface-3);border:1px solid var(--border);color:var(--text-muted)}
  .lead-tools{display:none;gap:8px;margin-bottom:14px;flex-wrap:wrap}.lead-tools.visible{display:flex}
  .cat-group{margin-bottom:20px}.cat-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:9px 16px;display:flex;justify-content:space-between;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--sk-teal-border);border-bottom:none}.cat-header .avail{color:var(--green);font-weight:700}
  .cat-entries{background:var(--surface);border:1px solid var(--sk-teal-border);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
  .entry{display:flex;justify-content:space-between;align-items:start;padding:11px 16px;border-bottom:1px solid #181a28;gap:10px;transition:background 0.1s}.entry:hover{background:var(--surface-2)}.entry:last-child{border-bottom:none}.entry-main{flex:1;min-width:0}.entry-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .func-name{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}.entry-desc{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.45}.entry-meta{font-size:11px;color:#484860;margin-top:3px}.entry-meta a{color:var(--sk-teal);font-size:11px}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap}.badge-available{color:var(--green);background:var(--green-bg);border:1px solid var(--green-border)}.badge-claimed{color:var(--yellow);background:var(--yellow-bg);border:1px solid var(--yellow-border)}.badge-in_progress{color:var(--blue);background:var(--blue-bg);border:1px solid var(--blue-border)}.badge-in_review{color:var(--purple);background:var(--purple-bg);border:1px solid var(--purple-border)}.badge-merged{color:var(--gray);background:var(--gray-bg);border:1px solid var(--gray-border)}
  .cat-tag{font-size:10px;color:#404055}.edit-btns{display:flex;gap:4px;flex-shrink:0}.icon-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-size:13px;padding:3px 8px;font-family:var(--font);transition:all 0.15s}.icon-btn:hover{border-color:var(--sk-teal);color:var(--text)}.icon-btn.del:hover{border-color:var(--red);color:var(--red)}

  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;animation:pulse 2s infinite}.live-dot.offline{background:var(--red);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .auth-area{display:flex;align-items:center;gap:8px;margin-top:2px}.auth-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);font-size:11px;font-weight:600;font-family:var(--font);cursor:pointer;transition:border-color 0.15s}.auth-btn:hover{border-color:var(--sk-teal-border);color:var(--text)}.auth-btn svg{width:14px;height:14px;fill:currentColor}.user-badge{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--sk-teal-border);background:var(--sk-teal-dim);font-size:11px;color:var(--sk-teal);font-weight:600}.user-badge img{width:18px;height:18px;border-radius:50%}.signout-btn{background:none;border:none;color:var(--text-muted);font-size:10px;cursor:pointer;font-family:var(--font);padding:2px 4px}.signout-btn:hover{color:var(--red)}.claim-owner{font-size:10px;color:var(--text-muted);font-style:italic}
  @media(max-width:600px){.header-top{flex-direction:column}.controls{flex-direction:column}.search-input,.cat-select{width:100%}.entry{flex-direction:column}.edit-btns{align-self:flex-end}.header h1{font-size:18px}.sk-logo{width:34px;height:34px}}
  .tabs{display:flex;gap:4px;padding:14px 0 0;border-bottom:1px solid var(--border)}
  .tab{background:transparent;border:1px solid transparent;border-bottom:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;padding:8px 15px;font-size:12px;font-weight:600;font-family:var(--font);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:7px;transition:color 0.15s,background 0.15s;position:relative;top:1px}
  .tab:hover{color:var(--text)}.tab.active{color:var(--sk-teal);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface)}
  .tab svg{width:13px;height:13px;fill:currentColor;flex-shrink:0}
  .board-wrap{overflow-x:auto;padding:4px 4px 14px;margin:0 -4px}
  .board{display:flex;gap:12px;align-items:flex-start;min-height:180px}
  .board-col{flex:0 0 250px;width:250px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 250px);transition:border-color 0.15s,box-shadow 0.15s}
  .board-col.drag-over{border-color:var(--sk-teal);box-shadow:0 0 0 2px var(--sk-teal-dim)}
  .col-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--border);background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;flex-shrink:0}
  .col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em}
  .col-count{margin-left:auto;font-size:10px;font-weight:600;color:var(--text-muted);background:var(--surface-3);border-radius:10px;padding:2px 8px}
  .col-body{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:70px}
  .card{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--gray);border-radius:var(--radius-sm);padding:10px 11px;transition:border-color 0.15s,opacity 0.15s}
  .card.draggable{cursor:grab}.card.draggable:hover{border-color:var(--border-hover)}.card.dragging{opacity:0.35}
  .card-title{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text);word-break:break-word;line-height:1.35}
  .card-desc{font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-foot{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
  .card-cat{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);background:var(--surface-3);border:1px solid var(--border);border-radius:4px;padding:2px 6px}
  .card-pr{font-size:10px;font-weight:600}
  .card-user{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text);margin-left:auto;max-width:100%;overflow:hidden}
  .card-user .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-avatar{width:16px;height:16px;border-radius:50%;color:#0f1117;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-transform:uppercase}
  .col-empty{font-size:11px;color:var(--text-muted);text-align:center;padding:16px 8px;border:1px dashed var(--border);border-radius:var(--radius-sm)}
  .board-hint{font-size:11px;color:var(--text-muted);padding:2px 0 0}
  @media(max-width:640px){.board-col{flex:0 0 80vw;width:80vw}}
  body.board-view .main,body.board-view .header-inner{max-width:1560px}
</style>

<body>
<div class="header"><div class="header-inner"><div class="header-top">
  <div class="header-brand">
    <svg class="sk-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="translate(5,5)"><path d="M10 30 L45 10 L80 30 L80 70 L45 90 L10 70 Z" fill="#e8a020" stroke="#3a3530" stroke-width="4" stroke-linejoin="round"/><path d="M10 30 L45 10 L80 30 L45 50 Z" fill="#f0b030" stroke="#3a3530" stroke-width="4" stroke-linejoin="round"/><path d="M10 30 L45 50 L45 90 L10 70 Z" fill="#d09018" stroke="#3a3530" stroke-width="4" stroke-linejoin="round"/><path d="M80 30 L45 50 L45 90 L80 70 Z" fill="#e8a020" stroke="#3a3530" stroke-width="4" stroke-linejoin="round"/><path d="M30 12 L30 45 L38 38 L46 45 L46 12" fill="#3cc8c8" stroke="#3a3530" stroke-width="3" stroke-linejoin="round"/><line x1="55" y1="68" x2="68" y2="62" stroke="#3a3530" stroke-width="3" stroke-linecap="round"/><line x1="55" y1="75" x2="65" y2="70" stroke="#3a3530" stroke-width="3" stroke-linecap="round"/></g></svg>
    <div><div class="brand-label">SplashKit Website</div><h1>Usage Example <span>Tracker</span></h1><div class="header-tagline">Built by a student for students.</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px">
    <label class="lead-toggle"><input type="checkbox" id="leadToggle"> Claim mode</label>
    <div class="auth-area" id="authArea">
      <button class="auth-btn" id="signInBtn" onclick="signInWithGitHub()"><svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>Sign in with GitHub</button>
    </div>
  </div>
</div></div></div>
<div class="main">
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="list" onclick="setView('list')"><svg viewBox="0 0 16 16"><path d="M1 3h14v2H1V3zm0 4h14v2H1V7zm0 4h14v2H1v-2z"/></svg>List</button>
    <button class="tab" data-view="board" onclick="setView('board')"><svg viewBox="0 0 16 16"><path d="M1 2h4v12H1V2zm5 0h4v8H6V2zm5 0h4v10h-4V2z"/></svg>Board</button>
  </div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="controls"><input class="search-input" id="searchInput" placeholder="Search function, description, contributor..." autocomplete="off"><select class="cat-select" id="catSelect"></select><button class="btn btn-accent" id="addBtn" style="display:none" onclick="openAdd()">+ Add</button></div>
  <div class="lead-tools" id="leadTools"><button class="btn btn-dim" onclick="exportJSON()">Export JSON</button><button class="btn btn-dim" onclick="importJSON()">Import JSON</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)"></div>
  <div id="content"></div>
</div>
<div class="modal-overlay" id="editModal" style="display:none"><div class="modal"><h2 id="modalTitle">Edit Entry</h2><label>Function Name<input id="mFuncName" placeholder="e.g. fill_rectangle"></label><label>Category<select id="mCategory"></select></label><label>Description<textarea id="mDesc" rows="2" placeholder="What does this example cover?"></textarea></label><label>Status<select id="mStatus"><option value="available">Available</option><option value="claimed">Claimed</option><option value="in_progress">In Progress</option><option value="in_review">In Review</option><option value="merged">Merged</option></select></label><label>Claimed By<input id="mClaimedBy" placeholder="GitHub username"></label><label>PR Link (optional)<input id="mPrLink" placeholder="https://github.com/..."></label><div class="modal-actions"><button class="btn btn-dim" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="saveModal()">Save</button></div></div></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getAuth, GithubAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDXIy9xKeIpy_Aa2i_xHHibd2CKB_Q-yCQ",
  authDomain: "splashkit-tracker.firebaseapp.com",
  databaseURL: "https://splashkit-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "splashkit-tracker",
  storageBucket: "splashkit-tracker.firebasestorage.app",
  messagingSenderId: "719014220435",
  appId: "1:719014220435:web:f3f35d8c06c5a373aff366"
};

try {
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GithubAuthProvider();
  const claimsRef = ref(db, 'claims');

  window._fbConnected = true;
  window._currentUser = null;

  // Auth state listener
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // GitHub username is in providerData
      const ghData = user.providerData.find(p => p.providerId === 'github.com');
      window._currentUser = {
        uid: user.uid,
        displayName: ghData?.displayName || user.displayName || '',
        username: ghData?.uid || '',  // GitHub numeric UID
        photoURL: user.photoURL || '',
        // We'll also fetch the GitHub username from the access token result
        githubUsername: ''
      };
      // Try to get GitHub username from the stored value
      const stored = localStorage.getItem('gh_username');
      if (stored) window._currentUser.githubUsername = stored;
      updateAuthUI();
    } else {
      window._currentUser = null;
      updateAuthUI();
    }
    if (typeof renderContent === 'function') renderContent();
  });

  // Sign in
  window.signInWithGitHub = async function() {
    try {
      const result = await signInWithPopup(auth, provider);
      const credential = GithubAuthProvider.credentialFromResult(result);
      // Fetch GitHub username using the access token
      if (credential?.accessToken) {
        try {
          const res = await fetch('https://api.github.com/user', {
            headers: { Authorization: 'token ' + credential.accessToken }
          });
          const ghUser = await res.json();
          if (ghUser.login) {
            window._currentUser.githubUsername = ghUser.login;
            localStorage.setItem('gh_username', ghUser.login);
          }
        } catch(e) { console.warn('Could not fetch GitHub username:', e); }
      }
      updateAuthUI();
      if (typeof renderContent === 'function') renderContent();
    } catch(e) {
      if (e.code !== 'auth/popup-closed-by-user') {
        console.error('Sign in failed:', e);
        alert('Sign in failed: ' + e.message);
      }
    }
  };

  // Sign out
  window.signOutUser = async function() {
    await signOut(auth);
    localStorage.removeItem('gh_username');
    window._currentUser = null;
    updateAuthUI();
    if (typeof renderContent === 'function') renderContent();
  };

  function updateAuthUI() {
    const area = document.getElementById('authArea');
    if (!area) return;
    const u = window._currentUser;
    if (u) {
      const name = u.githubUsername || u.displayName || 'User';
      area.innerHTML = `<div class="user-badge">${u.photoURL ? '<img src="'+u.photoURL+'" alt="">' : ''}${name}</div><button class="signout-btn" onclick="signOutUser()">sign out</button>`;
    } else {
      area.innerHTML = `<button class="auth-btn" id="signInBtn" onclick="signInWithGitHub()"><svg viewBox="0 0 16 16" style="width:14px;height:14px;fill:currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>Sign in with GitHub</button>`;
    }
  }

  // Check if current user owns a claim (or is a lead)
  window._canModifyClaim = function(functionName) {
    if (!window._currentUser) return false;
    const key = functionName.replace(/[.#$\[\]]/g, '_');
    const claim = (window._liveClaims || {})[key];
    if (!claim) return true; // no claim exists, anyone can create
    if (claim.uid === window._currentUser.uid) return true; // owner
    if (window._isLeadUser) return true; // leads can override
    return false;
  };

  // Save a claim to Firebase (with ownership)
  window._fbSaveClaim = function(functionName, claimData) {
    if (!window._currentUser) { alert('Sign in with GitHub to claim functions.'); return; }
    const key = functionName.replace(/[.#$\[\]]/g, '_');
    const existing = (window._liveClaims || {})[key];

    // Block if someone else owns this claim (unless lead)
    if (existing && existing.uid && existing.uid !== window._currentUser.uid && !window._isLeadUser) {
      alert('This function is already claimed by ' + (existing.claimedBy || 'someone else') + '. Only the owner or a lead can change it.');
      return;
    }

    set(ref(db, 'claims/' + key), {
      status: claimData.status,
      claimedBy: claimData.claimedBy || window._currentUser.githubUsername || '',
      prLink: claimData.prLink || '',
      uid: existing?.uid || window._currentUser.uid,
      updatedAt: new Date().toISOString()
    });
  };

  // Remove a claim from Firebase (with ownership check)
  window._fbRemoveClaim = function(functionName) {
    if (!window._currentUser) return;
    const key = functionName.replace(/[.#$\[\]]/g, '_');
    const existing = (window._liveClaims || {})[key];

    if (existing && existing.uid && existing.uid !== window._currentUser.uid && !window._isLeadUser) {
      alert('Only the owner or a lead can remove this claim.');
      return;
    }

    remove(ref(db, 'claims/' + key));
  };

  // Listen for real-time changes
  onValue(claimsRef, (snapshot) => {
    window._liveClaims = snapshot.val() || {};
    window._firebaseReady = true;
    if (typeof renderContent === 'function') renderContent();
  });

  // Check if user is a lead
  const leadsRef = ref(db, 'leads');
  onValue(leadsRef, (snapshot) => {
    const leads = snapshot.val() || {};
    if (window._currentUser) {
      window._isLeadUser = !!leads[window._currentUser.uid];
    }
  });

  console.log('Firebase connected');
} catch(e) {
  console.warn('Firebase not configured, running in offline mode:', e.message);
  window._fbConnected = false;
  window._firebaseReady = false;
}
</script>

<script>
const DATA_URL='tracker.json',STATUS_LABELS={available:'Available',claimed:'Claimed',in_progress:'In Progress',in_review:'In Review',merged:'Merged'},STATUS_COLORS={available:{c:'var(--green)',bg:'var(--green-bg)',b:'var(--green-border)'},claimed:{c:'var(--yellow)',bg:'var(--yellow-bg)',b:'var(--yellow-border)'},in_progress:{c:'var(--blue)',bg:'var(--blue-bg)',b:'var(--blue-border)'},in_review:{c:'var(--purple)',bg:'var(--purple-bg)',b:'var(--purple-border)'},merged:{c:'var(--gray)',bg:'var(--gray-bg)',b:'var(--gray-border)'}},CATEGORIES=["Animations","Audio","Camera","Color","Generative AI","Geometry","Graphics","Input","Interface","JSON","Logging","Networking","Physics","Raspberry","Resource Bundles","Resources","Sprites","Terminal","Timers","Types","Utilities","Windows","Other"];
let data={entries:[]},filterStatus='all',filterCategory='all',searchQuery='',isLead=false,editingId=null;
let currentView=localStorage.getItem('tracker-view')||'list',dragEntryId=null;
const searchInput=document.getElementById('searchInput'),catSelect=document.getElementById('catSelect'),statsBar=document.getElementById('statsBar'),content=document.getElementById('content'),addBtn=document.getElementById('addBtn'),leadTools=document.getElementById('leadTools');
catSelect.innerHTML='<option value="all">All categories</option>'+CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('');
const mCatSel=document.getElementById('mCategory');CATEGORIES.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;mCatSel.appendChild(o)});
let searchTimeout;searchInput.addEventListener('input',()=>{clearTimeout(searchTimeout);searchTimeout=setTimeout(()=>{searchQuery=searchInput.value;renderContent()},120)});
catSelect.addEventListener('change',()=>{filterCategory=catSelect.value;renderContent()});
document.getElementById('leadToggle').addEventListener('change',e=>{isLead=e.target.checked;addBtn.style.display=isLead?'':'none';leadTools.classList.toggle('visible',isLead);renderContent()});
async function loadData(){try{const r=await fetch(DATA_URL+'?t='+Date.now());if(!r.ok)throw new Error();data=await r.json()}catch(e){const s=localStorage.getItem('splashkit-tracker');if(s)data=JSON.parse(s);else data={entries:[]}}renderStats();renderContent()}
function saveLocal(){localStorage.setItem('splashkit-tracker',JSON.stringify(data))}function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

// Apply Firebase claims on top of tracker.json data
function applyFirebaseClaims(entries) {
  if (!window._firebaseReady || !window._liveClaims) return entries;
  const statusRank = { available:0, claimed:1, in_progress:2, in_review:3, merged:4 };
  entries.forEach(entry => {
    const key = entry.functionName.replace(/[.#$\[\]]/g, '_');
    const claim = window._liveClaims[key];
    if (!claim) return;
    const claimRank = statusRank[claim.status] || 0;
    const entryRank = statusRank[entry.status] || 0;
    // Firebase claim wins if entry is still available, or claim is higher status
    if (entry.status === 'available' || claimRank > entryRank) {
      entry.status = claim.status;
      if (claim.claimedBy) entry.claimedBy = claim.claimedBy;
      if (claim.prLink) entry.prLink = claim.prLink;
    }
  });
  return entries;
}

function renderStats(){const entries=applyFirebaseClaims(data.entries||[]);const stats={};Object.keys(STATUS_LABELS).forEach(s=>stats[s]=entries.filter(e=>e.status===s).length);let h='';if(window._firebaseReady){h+='<span class="live-dot"></span> '}else if(window._fbConnected===false){h+='<span class="live-dot offline"></span> '}Object.entries(STATUS_LABELS).forEach(([k,l])=>{const sc=STATUS_COLORS[k],a=filterStatus===k,cl=filterStatus==='all'?'':(a?'active':'dimmed');h+=`<button class="stat-btn ${cl}" style="color:${sc.c};border-color:${a?sc.b:'var(--border)'};background:${a?sc.bg:'transparent'}" onclick="toggleStatus('${k}')">${l}: ${stats[k]||0}</button>`});if(filterStatus!=='all')h+=`<button class="stat-btn" style="color:var(--text-muted)" onclick="toggleStatus('all')">show all</button>`;statsBar.innerHTML=h}

function renderList(){const entries=applyFirebaseClaims(data.entries||[]);const filtered=entries.filter(e=>{if(filterStatus!=='all'&&e.status!==filterStatus)return false;if(filterCategory!=='all'&&e.category!==filterCategory)return false;if(searchQuery){const q=searchQuery.toLowerCase();return e.functionName.toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)||(e.claimedBy||'').toLowerCase().includes(q)}return true}),groups={};filtered.forEach(e=>{if(!groups[e.category])groups[e.category]=[];groups[e.category].push(e)});const cats=Object.keys(groups).sort();let h='';if(!filtered.length){h+=entries.length===0?'<div class="empty"><p style="font-size:14px;margin-bottom:8px">No data loaded.</p><p style="font-size:12px">Enable Claim mode and Import JSON.</p></div>':'<div class="empty"><p style="font-size:13px">No entries match your filters.</p></div>'}else{cats.forEach(cat=>{const ce=groups[cat],ac=ce.filter(e=>e.status==='available').length;h+='<div class="cat-group">';h+=`<div class="cat-header"><span>${esc(cat)}</span>${ac>0?`<span class="avail">${ac} available</span>`:''}`;h+='</div><div class="cat-entries">';ce.forEach(e=>{h+=`<div class="entry"><div class="entry-main"><div class="entry-top"><span class="func-name">${esc(e.functionName)}</span><span class="badge badge-${e.status}">${STATUS_LABELS[e.status]||e.status}</span><span class="cat-tag">${esc(e.category)}</span></div>`;if(e.description&&!e.description.startsWith('(add description'))h+=`<div class="entry-desc">${esc(e.description)}</div>`;if(e.claimedBy){h+=`<div class="entry-meta">&rarr; ${esc(e.claimedBy)}`;if(e.prLink)h+=` <a href="${esc(e.prLink)}" target="_blank" rel="noopener">PR &nearr;</a>`;h+='</div>'}h+='</div>';if(isLead)h+=`<div class="edit-btns"><button class="icon-btn" onclick="openEdit('${e.id}')">✎</button><button class="icon-btn del" onclick="deleteEntry('${e.id}')">✕</button></div>`;h+='</div>'});h+='</div></div>'})}const st={};Object.keys(STATUS_LABELS).forEach(s=>st[s]=entries.filter(e=>e.status===s).length);h+=`<div class="footer">${entries.length} functions &middot; ${st.available||0} available &middot; <a href="https://splashkit.io/api/" target="_blank">splashkit.io</a>`;if(data.lastUpdated)h+=` &middot; synced ${new Date(data.lastUpdated).toLocaleDateString()}`;h+='</div>';content.innerHTML=h;renderStats()}

function renderContent(){currentView==='board'?renderBoard():renderList()}

function setView(v){currentView=v;localStorage.setItem('tracker-view',v);syncTabs();renderContent();window.scrollTo({top:0,behavior:'smooth'})}
function syncShell(){document.body.classList.toggle('board-view',currentView==='board')}
function syncTabs(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===currentView));syncShell()}

function matchesFilters(e){
  if(filterCategory!=='all'&&e.category!==filterCategory)return false;
  if(searchQuery){const q=searchQuery.toLowerCase();return e.functionName.toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)||(e.claimedBy||'').toLowerCase().includes(q)}
  return true;
}
function hasRealDesc(d){return d&&!d.startsWith('(add description')&&!d.startsWith('Describe the example')}
function footerHTML(entries){const st={};Object.keys(STATUS_LABELS).forEach(s=>st[s]=entries.filter(e=>e.status===s).length);let h=`<div class="footer">${entries.length} functions &middot; ${st.available||0} available &middot; <a href="https://splashkit.io/api/" target="_blank">splashkit.io</a>`;if(data.lastUpdated)h+=` &middot; synced ${new Date(data.lastUpdated).toLocaleDateString()}`;return h+'</div>'}

function cardHTML(e){
  const sc=STATUS_COLORS[e.status]||STATUS_COLORS.available;
  const drag=isLead?` draggable="true" ondragstart="cardDragStart(event,'${e.id}')" ondragend="cardDragEnd(event)"`:'';
  const click=isLead?` onclick="openEdit('${e.id}')"`:'';
  let h=`<div class="card${isLead?' draggable':''}"${drag}${click} style="border-left-color:${sc.c}">`;
  h+=`<div class="card-title">${esc(e.functionName)}</div>`;
  if(hasRealDesc(e.description))h+=`<div class="card-desc">${esc(e.description)}</div>`;
  h+='<div class="card-foot">';
  h+=`<span class="card-cat">${esc(e.category)}</span>`;
  if(e.prLink)h+=`<a class="card-pr" href="${esc(e.prLink)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">PR &nearr;</a>`;
  if(e.claimedBy)h+=`<span class="card-user" title="${esc(e.claimedBy)}"><span class="card-avatar" style="background:${sc.c}">${esc(e.claimedBy.slice(0,1))}</span><span class="n">${esc(e.claimedBy)}</span></span>`;
  h+='</div></div>';
  return h;
}

function renderBoard(){
  const entries=applyFirebaseClaims(data.entries||[]);
  const filtered=entries.filter(matchesFilters);
  const byStatus={};Object.keys(STATUS_LABELS).forEach(s=>byStatus[s]=[]);
  filtered.forEach(e=>{(byStatus[e.status]||byStatus.available).push(e)});
  const cols=Object.keys(STATUS_LABELS).filter(s=>filterStatus==='all'||filterStatus===s);
  let h='<div class="board-wrap"><div class="board">';
  cols.forEach(s=>{
    const sc=STATUS_COLORS[s],list=byStatus[s];
    h+=`<div class="board-col" data-status="${s}" ondragover="boardDragOver(event)" ondragleave="boardDragLeave(event)" ondrop="boardDrop(event,'${s}')">`;
    h+=`<div class="col-head"><span class="col-dot" style="background:${sc.c}"></span><span class="col-title" style="color:${sc.c}">${STATUS_LABELS[s]}</span><span class="col-count">${list.length}</span></div>`;
    h+='<div class="col-body">';
    if(!list.length)h+='<div class="col-empty">'+(isLead?'Drop a card here':'Nothing here')+'</div>';
    list.forEach(e=>{h+=cardHTML(e)});
    h+='</div></div>';
  });
  h+='</div></div>';
  h+=isLead?'<div class="board-hint">Drag a card to another column to change its status, or click it to edit the claim.</div>'
           :'<div class="board-hint">Turn on <strong>Claim mode</strong> above to drag cards and claim functions.</div>';
  h+=footerHTML(entries);
  content.innerHTML=h;
  renderStats();
}

function cardDragStart(ev,id){dragEntryId=id;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',id)}catch(_){}ev.currentTarget.classList.add('dragging')}
function cardDragEnd(ev){ev.currentTarget.classList.remove('dragging');document.querySelectorAll('.board-col.drag-over').forEach(c=>c.classList.remove('drag-over'))}
function boardDragOver(ev){if(!dragEntryId)return;ev.preventDefault();ev.dataTransfer.dropEffect='move';ev.currentTarget.classList.add('drag-over')}
function boardDragLeave(ev){if(!ev.currentTarget.contains(ev.relatedTarget))ev.currentTarget.classList.remove('drag-over')}
function boardDrop(ev,status){ev.preventDefault();ev.currentTarget.classList.remove('drag-over');const id=dragEntryId||ev.dataTransfer.getData('text/plain');dragEntryId=null;if(id)moveEntryToStatus(id,status)}

function moveEntryToStatus(id,status){
  const e=data.entries.find(x=>x.id===id);
  if(!e||e.status===status)return;
  if(window._firebaseReady){
    if(status!=='available'&&!window._currentUser){alert('Sign in with GitHub to claim functions.');return}
    if(!window._canModifyClaim(e.functionName)){alert('This function is claimed by someone else. Only the owner or a lead can change it.');return}
  }
  e.status=status;
  if(status!=='available'&&!e.claimedBy&&window._currentUser){e.claimedBy=window._currentUser.githubUsername||window._currentUser.displayName||''}
  data.lastUpdated=new Date().toISOString();
  saveLocal();
  if(window._firebaseReady){status==='available'?window._fbRemoveClaim(e.functionName):window._fbSaveClaim(e.functionName,e)}
  renderContent();
}

function toggleStatus(s){filterStatus=filterStatus===s?'all':s;renderContent()}
function openEdit(id){editingId=id;const e=data.entries.find(x=>x.id===id);if(!e)return;if(window._firebaseReady && e.status!=='available' && !window._canModifyClaim(e.functionName)){alert('This function is claimed by someone else. Only the owner or a lead can edit it.');return}document.getElementById('modalTitle').textContent='Edit Entry';document.getElementById('mFuncName').value=e.functionName||'';document.getElementById('mCategory').value=e.category||'Other';document.getElementById('mDesc').value=e.description||'';document.getElementById('mStatus').value=e.status||'available';document.getElementById('mClaimedBy').value=e.claimedBy||(window._currentUser?window._currentUser.githubUsername||'':'');document.getElementById('mPrLink').value=e.prLink||'';document.getElementById('editModal').style.display='flex'}
function openAdd(){editingId=null;document.getElementById('modalTitle').textContent='Add Entry';document.getElementById('mFuncName').value='';document.getElementById('mCategory').value=filterCategory!=='all'?filterCategory:'Graphics';document.getElementById('mDesc').value='';document.getElementById('mStatus').value='available';document.getElementById('mClaimedBy').value='';document.getElementById('mPrLink').value='';document.getElementById('editModal').style.display='flex'}
function closeModal(){document.getElementById('editModal').style.display='none'}

function saveModal(){
  const entry={functionName:document.getElementById('mFuncName').value.trim(),category:document.getElementById('mCategory').value,description:document.getElementById('mDesc').value.trim(),status:document.getElementById('mStatus').value,claimedBy:document.getElementById('mClaimedBy').value.trim(),prLink:document.getElementById('mPrLink').value.trim()};
  if(!entry.functionName)return;

  // Check ownership before allowing changes to claimed functions
  if(window._firebaseReady && entry.status !== 'available' && !window._currentUser){
    alert('Sign in with GitHub to claim functions.');return;
  }
  if(window._firebaseReady && !window._canModifyClaim(entry.functionName)){
    alert('This function is claimed by someone else. Only the owner or a lead can change it.');return;
  }

  // Auto-fill claimedBy with GitHub username if claiming
  if(entry.status !== 'available' && !entry.claimedBy && window._currentUser){
    entry.claimedBy = window._currentUser.githubUsername || window._currentUser.displayName || '';
  }

  if(editingId){const i=data.entries.findIndex(e=>e.id===editingId);if(i>=0)Object.assign(data.entries[i],entry)}
  else{entry.id=genId();entry.createdAt=new Date().toISOString();data.entries.push(entry)}
  data.lastUpdated=new Date().toISOString();
  saveLocal();

  if(window._firebaseReady && entry.status !== 'available'){
    window._fbSaveClaim(entry.functionName, entry);
  } else if(window._firebaseReady && entry.status === 'available'){
    window._fbRemoveClaim(entry.functionName);
  }

  closeModal();renderContent()
}

function deleteEntry(id){const e=data.entries.find(x=>x.id===id);if(!e)return;if(window._firebaseReady && e.status!=='available' && !window._canModifyClaim(e.functionName)){alert('This function is claimed by someone else. Only the owner or a lead can remove it.');return}if(!confirm('Remove this entry?'))return;if(e && window._firebaseReady){window._fbRemoveClaim(e.functionName)}data.entries=data.entries.filter(x=>x.id!==id);data.lastUpdated=new Date().toISOString();saveLocal();renderContent()}
function exportJSON(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tracker.json';a.click();URL.revokeObjectURL(a.href)}
function importJSON(){document.getElementById('importFile').click()}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{const d=JSON.parse(ev.target.result);if(d.entries&&Array.isArray(d.entries)){data=d;data.lastUpdated=new Date().toISOString();saveLocal();renderContent()}else alert('Invalid JSON.')}catch(err){alert('Invalid JSON file.')}};r.readAsText(f);e.target.value=''}
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
syncTabs();
loadData();
</script>
